name: Hello Python app to Docker

on:
  push:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
            python-version: '3.13'

      - name: Install Dependencies
        working-directory: docker/app1-hello/python
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - name: Run Smoke Test
        run: python -m py_compile docker/app1-hello/python/app.py

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: docker/app1-hello/python
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/hello-python-app:latest